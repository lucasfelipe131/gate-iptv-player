name: Build GATE TV Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "platforms/android-native/**"
      - "public/**"
      - "server.mjs"
      - "package.json"
      - "package-lock.json"
      - "test/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Test web player and TV navigation
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build and lint universal APK
        working-directory: platforms/android-native
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug

      - name: Prepare APK and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m 0444 platforms/android-native/app/build/outputs/apk/debug/app-debug.apk dist/GATE-TV-v0.6.2-TCL-BlueStacks.apk
          unzip -tq dist/GATE-TV-v0.6.2-TCL-BlueStacks.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/GATE-TV-v0.6.2-TCL-BlueStacks.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/GATE-TV-v0.6.2-TCL-BlueStacks.apk
          sha256sum dist/GATE-TV-v0.6.2-TCL-BlueStacks.apk | tee dist/GATE-TV-v0.6.2-SHA256.txt
          sha256sum -c dist/GATE-TV-v0.6.2-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GATE-TV-v0.6.2-TCL-BlueStacks
          path: dist/GATE-TV-v0.6.2-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
