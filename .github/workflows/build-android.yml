name: Build GATE TV Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "platforms/android-native/**"
      - "public/**"
      - "server.mjs"
      - "package.json"
      - "package-lock.json"
      - "test/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Test web player and TV navigation
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build and lint universal APK
        working-directory: platforms/android-native
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug

      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp platforms/android-native/app/build/outputs/apk/debug/app-debug.apk dist/GATE-TV-v0.5.0-TCL-BlueStacks.apk
          sha256sum dist/GATE-TV-v0.5.0-TCL-BlueStacks.apk | tee dist/GATE-TV-v0.5.0-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GATE-TV-v0.5.0-TCL-BlueStacks
          path: dist/GATE-TV-v0.5.0-*
          if-no-files-found: error
          retention-days: 90
