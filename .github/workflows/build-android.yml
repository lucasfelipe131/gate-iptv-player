name: Build GATE TV Android APK and AAB

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "platforms/android-native/**"
      - "public/**"
      - "server.mjs"
      - "package.json"
      - "package-lock.json"
      - "test/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Test web player and TV navigation
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build and lint Android TV packages
        working-directory: platforms/android-native
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug :app:bundleRelease

      - name: Prepare APKs, unsigned Play bundle and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          apk_dir=platforms/android-native/app/build/outputs/apk/debug
          bundle=platforms/android-native/app/build/outputs/bundle/release/app-release.aab
          install -m 0444 "$apk_dir/app-arm64-v8a-debug.apk" dist/GATE-TV-v0.6.5-TCL-ARM64.apk
          install -m 0444 "$apk_dir/app-armeabi-v7a-debug.apk" dist/GATE-TV-v0.6.5-TCL-ARM32.apk
          install -m 0444 "$bundle" dist/GATE-TV-v0.6.5-Google-Play-unsigned.aab

          for apk in dist/*.apk; do
            stat -c '%n %s bytes' "$apk"
            unzip -tq "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
            test "$(stat -c %s "$apk")" -lt 188743680
          done

          unzip -tq dist/GATE-TV-v0.6.5-Google-Play-unsigned.aab
          unzip -Z1 dist/GATE-TV-v0.6.5-Google-Play-unsigned.aab | grep -q '^base/lib/arm64-v8a/'
          unzip -Z1 dist/GATE-TV-v0.6.5-Google-Play-unsigned.aab | grep -q '^base/lib/armeabi-v7a/'
          ! unzip -Z1 dist/GATE-TV-v0.6.5-Google-Play-unsigned.aab | grep -qE '^base/lib/(x86|x86_64)/'

          unzip -Z1 dist/GATE-TV-v0.6.5-TCL-ARM64.apk | grep -q '^lib/arm64-v8a/'
          unzip -Z1 dist/GATE-TV-v0.6.5-TCL-ARM32.apk | grep -q '^lib/armeabi-v7a/'
          ! unzip -Z1 dist/GATE-TV-v0.6.5-TCL-ARM64.apk | grep -qE '^lib/(armeabi-v7a|x86|x86_64)/'
          ! unzip -Z1 dist/GATE-TV-v0.6.5-TCL-ARM32.apk | grep -qE '^lib/(arm64-v8a|x86|x86_64)/'

          cd dist
          sha256sum ./*.apk ./*.aab | sed 's#  \./#  #' > GATE-TV-v0.6.5-SHA256.txt
          sha256sum -c GATE-TV-v0.6.5-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GATE-TV-v0.6.5-Android-APK-AAB
          path: dist/GATE-TV-v0.6.5-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
