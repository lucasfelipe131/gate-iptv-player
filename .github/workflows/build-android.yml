name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ["platforms/android-native/**", ".github/workflows/build-android.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platforms/android-native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle wrapper --gradle-version 8.7
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GATE-IPTV-PLAYER-v0.4.3-LibVLC
          path: platforms/android-native/app/build/outputs/apk/debug/app-debug.apk
