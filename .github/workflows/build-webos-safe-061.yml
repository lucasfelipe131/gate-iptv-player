name: Build LG webOS Hosted Boot 0.6.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-webos-safe-061.yml'
      - 'platforms/webos/**'
      - 'platforms/lg-webos/assets/**'
      - 'public/index-webos.html'
      - 'public/platform-player.js'
      - 'public/webos-safe-*.js'
      - 'public/webos-safe.css'
      - 'scripts/package-webos.sh'
      - 'server.mjs'
      - 'test/webos-safe-mode.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-webos-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate project
        run: |
          npm ci
          npm test
          node --check public/webos-safe-bootstrap.js
          node --check public/webos-remote-safe.js
          node -e "const x=JSON.parse(require('fs').readFileSync('platforms/webos/appinfo.json','utf8')); if(x.version!=='0.6.4') process.exit(1)"

      - name: Install LG webOS CLI
        run: npm install -g @webos-tools/cli

      - name: Package IPK
        run: |
          sh scripts/package-webos.sh
          ls -lh dist/webos
          test -n "$(find dist/webos -maxdepth 1 -name '*0.6.4*.ipk' -print -quit)"

      - name: Upload definitive LG package
        uses: actions/upload-artifact@v4
        with:
          name: GATE-IPTV-PLAYER-LG-webOS-0.6.4-hosted
          path: dist/webos/*.ipk
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
