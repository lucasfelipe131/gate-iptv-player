name: Publish LG webOS Safe Mode

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lg-webos-safe-hotfix-v2.yml'

permissions:
  contents: write

jobs:
  publish-safe-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reapply the validated LG safe-mode patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import textwrap

          workflow = Path('.github/workflows/lg-webos-safe-hotfix.yml').read_text(encoding='utf-8')
          match = re.search(
              r"python - <<'PY'\n(?P<body>[\s\S]*?)\n\s{10}PY\n\n\s{6}- name: Validate hotfix",
              workflow
          )
          if not match:
              raise SystemExit('Could not recover the LG safe-mode patch body')
          body = textwrap.dedent(match.group('body'))
          exec(compile(body, 'lg-webos-safe-hotfix.py', 'exec'), {})

          appinfo_path = Path('platforms/webos/appinfo.json')
          appinfo = json.loads(appinfo_path.read_text(encoding='utf-8'))
          appinfo['version'] = '0.6.1'
          appinfo['appDescription'] = 'Player autorizado e otimizado para webOS TV 22 ou superior'
          appinfo['supportTouchMode'] = 'virtual'
          appinfo_path.write_text(json.dumps(appinfo, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          structure_path = Path('test/project-structure.test.mjs')
          structure = structure_path.read_text(encoding='utf-8')
          structure = structure.replace(
              'test("mantém quatro produtos separados e versionados em 0.6.0", async () => {',
              'test("mantém produtos separados e publica o hotfix webOS 0.6.1", async () => {'
          )
          structure = structure.replace(
              'assert.equal(JSON.parse(webos).version, "0.6.0");',
              'assert.equal(JSON.parse(webos).version, "0.6.1");'
          )
          structure_path.write_text(structure, encoding='utf-8')
          PY

      - name: Validate full project and LG package inputs
        run: |
          npm ci
          npm test
          node --check public/app.js
          node --check public/webos-safe-bootstrap.js
          node --check public/webos-remote-safe.js
          node --check server.mjs
          node -e "JSON.parse(require('fs').readFileSync('platforms/webos/appinfo.json','utf8'))"
          sh -n scripts/package-webos.sh

      - name: Commit and publish the hotfix
        shell: bash
        run: |
          git config user.name "GATE TV Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Dockerfile server.mjs public/index-webos.html public/webos-safe.css public/webos-safe-bootstrap.js public/webos-remote-safe.js platforms/webos/appinfo.json platforms/webos/bridge.js .github/workflows/build-webos.yml test/webos-safe-mode.test.mjs test/project-structure.test.mjs
          git commit -m "fix: publish lightweight LG webOS safe mode 0.6.1"
          git push
