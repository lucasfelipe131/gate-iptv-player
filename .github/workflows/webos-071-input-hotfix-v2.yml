name: Apply LG webOS 0.7.1 Input Hotfix v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/webos-071-input-hotfix-v2.yml'

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply the corrected patch program
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/webos-071-input-hotfix.yml').read_text(encoding='utf-8')
          match = re.search(
              r"python - <<'PY'\n(?P<body>[\s\S]*?)\n\s{10}PY\n\n\s{6}- name: Validate complete project",
              source
          )
          if not match:
              raise SystemExit('Could not extract original patch program')

          body = textwrap.dedent(match.group('body'))
          old_helper = '''def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Expected block not found: {label}')
              return text.replace(old, new, 1)'''
          new_helper = '''def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if label == 'disable service worker on webOS runtime':
                  pattern = re.compile(
                      r'  if \("serviceWorker" in navigator\) \{\\n'
                      r'    navigator\.serviceWorker\.register\("/sw\.js", \{ updateViaCache: "none" \}\)\\n'
                      r'      \.then\(\(registration\) => registration\.update\(\)\)\\n'
                      r'      \.catch\(\(\) => \{\}\);\\n'
                      r'  \}',
                      re.M
                  )
                  updated, count = pattern.subn(new, text, count=1)
                  if count == 1:
                      return updated
              raise SystemExit(f'Expected block not found: {label}')'''
          if old_helper not in body:
              raise SystemExit('Could not replace patch helper')
          body = body.replace(old_helper, new_helper, 1)
          exec(compile(body, 'webos-071-hotfix.py', 'exec'), {})
          PY

      - name: Validate complete project
        run: |
          npm ci
          node --check public/app.js
          node --check public/webos-remote.js
          node --check public/webos-android-runtime.js
          node --check platforms/webos/bridge.js
          node -e "const x=JSON.parse(require('fs').readFileSync('platforms/webos/appinfo.json','utf8')); if(x.version!=='0.7.1') process.exit(1)"
          npm test
          sh -n scripts/package-webos.sh

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "GATE TV Automation"
          git config user.email "actions@users.noreply.github.com"
          git add public/app.js public/webos-remote.js public/webos-android-runtime.js public/index-webos-android.html public/webos-input-fix.css platforms/webos/appinfo.json platforms/webos/index.html platforms/webos/bridge.js platforms/webos/README.md test/project-structure.test.mjs test/smart-tv-platforms.test.mjs test/webos-safe-mode.test.mjs test/webos-input-stability.test.mjs
          git commit -m "fix(webos): stabilize remote navigation and QR pairing 0.7.1"
          git push
