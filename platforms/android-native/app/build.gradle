plugins { id 'com.android.application' }

def releaseSigningValues = [
    storePath: System.getenv('ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD')
]
def hasReleaseSigning = releaseSigningValues.values().every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace 'com.gateone.app.gateiptvplayer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.gateone.app.gateiptvplayer'
        minSdk 23
        targetSdk 35
        versionCode 65
        versionName '0.6.5'
    }

    // Real Android/Google TV devices use ARM. Keeping x86/x86_64 native VLC
    // binaries in the sideload package more than doubles the APK and can make
    // older TV installers reject or truncate it. Debug builds remain split by
    // architecture; Google Play receives one AAB and creates device splits.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }

    bundle {
        abi { enableSplit = true }
        density { enableSplit = true }
        language { enableSplit = false }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseSigningValues.storePath)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        // IMA 3.39+ uses Java APIs that require core library desugaring on
        // older Android TV versions supported by this project.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkDependencies true
        checkReleaseBuilds true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.google.ads.interactivemedia.v3:interactivemedia:3.39.0'
    implementation 'org.videolan.android:libvlc-all:3.7.5'
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.0'
    implementation 'androidx.media3:media3-ui:1.11.0'
}
