<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: https: http:; connect-src https://gate-iptv-player-production.up.railway.app; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>GATE TV</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(circle at 50% 20%, #132847 0, #081221 38%, #050a13 100%);
      color: #f7f9fc;
      font-family: Arial, Helvetica, sans-serif;
    }
    .safe-area {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      padding: 54px 72px;
      padding-top: calc(54px + env(safe-area-inset-top, 0px));
      padding-right: calc(72px + env(safe-area-inset-right, 0px));
      padding-bottom: calc(54px + env(safe-area-inset-bottom, 0px));
      padding-left: calc(72px + env(safe-area-inset-left, 0px));
    }
    main { width: 100%; max-width: 920px; text-align: center; }
    .mark {
      display: inline-flex;
      width: 132px;
      height: 132px;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
      border: 2px solid rgba(89, 157, 255, .45);
      border-radius: 34px;
      background: linear-gradient(145deg, #1778ff, #0b3d91);
      box-shadow: 0 24px 70px rgba(0, 94, 255, .3);
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -5px;
    }
    h1 { margin: 0; font-size: 64px; letter-spacing: 5px; }
    p { margin: 22px 0 38px; color: #aebbd0; font-size: 27px; line-height: 1.45; }
    button {
      min-width: 330px;
      padding: 22px 40px;
      border: 3px solid transparent;
      border-radius: 16px;
      background: #1778ff;
      color: #fff;
      font-size: 27px;
      font-weight: 700;
    }
    button:focus { outline: 0; border-color: #d5ff47; transform: scale(1.04); }
    small { display: block; margin-top: 34px; color: #71809a; font-size: 19px; }
    #gate-native-surface {
      position: fixed;
      z-index: -1;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="safe-area">
    <main aria-live="polite">
      <div class="mark" aria-hidden="true">G</div>
      <h1>GATE TV</h1>
      <p id="status">Preparando a melhor experiencia para sua TV LG…</p>
      <button id="retry" type="button">Conectar novamente</button>
      <small>Use somente listas e fontes que voce esteja autorizado a acessar.</small>
    </main>
  </div>
  <script src="bridge.js"></script>
</body>
</html>
