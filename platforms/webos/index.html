<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src blob: https: http:; connect-src https: http:; frame-src https://gate-iptv-player-production.up.railway.app; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>GATE TV</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050a13; }
    body { color: #f7f9fc; font-family: Arial, Helvetica, sans-serif; }
    #gate-app-frame { position: fixed; z-index: 1; inset: 0; width: 100%; height: 100%; border: 0; background: #050a13; }
    #gate-native-surface { position: fixed; z-index: 2; margin: 0; border: 0; background: #000; object-fit: contain; pointer-events: none; }
    .connection-state { position: fixed; z-index: 4; inset: 0; display: flex; align-items: center; justify-content: center; padding: 54px 72px; background: radial-gradient(circle at 50% 20%, #132847 0, #081221 38%, #050a13 100%); text-align: center; }
    .connection-state.hidden { display: none; }
    main { width: 100%; max-width: 920px; }
    .mark { display: inline-grid; width: 132px; height: 132px; place-items: center; margin-bottom: 30px; border: 2px solid rgba(207,255,55,.42); border-radius: 34px; background: linear-gradient(145deg,#1778ff,#0b3d91); box-shadow: 0 24px 70px rgba(0,94,255,.3); font-size: 56px; font-weight: 800; }
    h1 { margin: 0; font-size: 64px; letter-spacing: 5px; }
    p { margin: 22px 0 38px; color: #aebbd0; font-size: 27px; line-height: 1.45; }
    button { min-width: 330px; padding: 22px 40px; border: 3px solid transparent; border-radius: 16px; background: #b7ff24; color: #07101f; font-size: 27px; font-weight: 800; }
    button:focus { outline: 0; border-color: #fff; transform: scale(1.04); }
    small { display: block; margin-top: 34px; color: #71809a; font-size: 19px; }
  </style>
</head>
<body>
  <iframe id="gate-app-frame" title="GATE TV" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <div class="connection-state" id="connection-state">
    <main aria-live="polite">
      <div class="mark" aria-hidden="true">G</div>
      <h1>GATE TV</h1>
      <p id="status">Preparando a experiência para sua TV LG…</p>
      <button id="retry" type="button">Conectar novamente</button>
      <small>Use somente listas e fontes que você esteja autorizado a acessar.</small>
    </main>
  </div>
  <script src="bridge.js"></script>
</body>
</html>
